spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
    url: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.xvymbqmkkuljfndhavri
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
    cache:
      type: redis
      redis:
        time-to-live: 300000

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: ${GEMINI_MODEL}

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

rate-limit:
  capacity: 20
  refill-tokens: 20
  refill-seconds: 60